services:
  postgres:
    image: postgres:15
    container_name: ancord_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-ancord_db}
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ancord-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ancord_backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Прокидываем переменные напрямую в контейнер
      DB_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-secretpassword}@postgres:5432/${POSTGRES_DB:-ancord_db}?sslmode=disable
      JWT_KEY: ${JWT_KEY:-super_secret_key_123}
      PORT: 8080
    networks:
      - ancord-network

  frontend:
    build:
      context: ./frontend # <--- Указываем папку фронтенда
      dockerfile: Dockerfile
    container_name: ancord_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - ancord-network
  voice_test:
    build:
      context: ./voice_test
      dockerfile: Dockerfile
    container_name: ancord_sfu
    ports:
      - "8081:8080" # WebSocket сигнализация (изменен порт, чтобы не конфликтовать с backend)
      - "3478:3478/udp" # TURN сервер
    env_file:
      - .env
    restart: unless-stopped
    environment:
      - PORT=8080
    depends_on:
      - backend
    networks:
      - ancord-network

volumes:
  pgdata:
    #TODO автокомпозирование

networks:
  ancord-network:
    driver: bridge
